<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vademecum Epithelium</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- PANTALLA DE LOGIN -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="logo-login">
                    <img src="logo.png" alt="Epithelium Logo">
                </div>
                <h1>Vademecum Epithelium</h1>
                <p>Ingresa tu código de acceso</p>
                <input type="password" id="accessCode" placeholder="Código de acceso" maxlength="20">
                <button onclick="verificarCodigo()">Acceder</button>
                <p id="errorMsg" class="error"></p>
            </div>
        </div>

        <!-- PANTALLA PRINCIPAL -->
        <div id="mainScreen" class="screen">
            <div class="header">
                <div class="header-logo">
                    <img src="logo.png" alt="Epithelium" class="header-logo-img">
                    <h1>Vademecum</h1>
                </div>
                <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
            </div>

            <div class="filters">
                <input type="text" id="searchName" placeholder="Buscar por nombre..." onkeyup="filtrar()">
                <input type="text" id="searchComponents" placeholder="Buscar por componentes..." onkeyup="filtrar()">
                <select id="filterCategory" onchange="filtrar()">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="filterFormula" onchange="filtrar()">
                    <option value="">Todas las formas</option>
                </select>
            </div>

            <div id="resultados" class="resultados"></div>
        </div>

        <!-- MODAL DETALLE -->
        <div id="modalDetail" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal()">&times;</span>
                <div id="detailContent"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
